apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gxdch-issuer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Data-Space-Core/GXDCH-Issuer.git
    targetRevision: main
    path: platform-apps/gxdch-issuer
  destination:
    server: https://kubernetes.default.svc
    namespace: gxdch-issuer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
