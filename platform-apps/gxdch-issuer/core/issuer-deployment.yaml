apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataspace-issuer-service
  namespace: gxdch-issuer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataspace-issuer-service
  template:
    metadata:
      labels:
        app: dataspace-issuer-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.3-alpine3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h issuer-postgres -p 5432 -U postgres; do
                echo "waiting for issuer-postgres"
                sleep 2
              done
        - name: migrate-legacy-schema
          image: postgres:16.3-alpine3.20
          imagePullPolicy: IfNotPresent
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: POSTGRES_DB
          command:
            - /bin/sh
            - -ec
            - |
              psql -h issuer-postgres -v ON_ERROR_STOP=1 <<'SQL'
              ALTER TABLE edc_sts_client ADD COLUMN IF NOT EXISTS participant_context_id VARCHAR;
              UPDATE edc_sts_client SET participant_context_id = id WHERE participant_context_id IS NULL;
              ALTER TABLE edc_sts_client ALTER COLUMN participant_context_id SET NOT NULL;
              DO '
              BEGIN
                IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = ''edc_sts_client'' AND column_name = ''private_key_alias'') THEN
                  EXECUTE ''ALTER TABLE edc_sts_client ALTER COLUMN private_key_alias DROP NOT NULL'';
                END IF;
                IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = ''edc_sts_client'' AND column_name = ''public_key_reference'') THEN
                  EXECUTE ''ALTER TABLE edc_sts_client ALTER COLUMN public_key_reference DROP NOT NULL'';
                END IF;
              END';
              ALTER TABLE edc_lease ADD COLUMN IF NOT EXISTS resource_id VARCHAR;
              ALTER TABLE edc_lease ADD COLUMN IF NOT EXISTS resource_kind VARCHAR;
              UPDATE edc_lease SET resource_kind = 'issuance-process' WHERE resource_kind IS NULL;
              ALTER TABLE keypair_resource ALTER COLUMN usage TYPE VARCHAR USING usage::text;
              ALTER TABLE holders ADD COLUMN IF NOT EXISTS anonymous BOOLEAN NOT NULL DEFAULT FALSE;
              ALTER TABLE holders ADD COLUMN IF NOT EXISTS properties JSON DEFAULT '{}';
              SQL
      containers:
        - name: issuerservice
          image: ghcr.io/data-space-core/issuerservice:0.18.0-identity-auth-sql-vault-20260924-2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dataspace-issuer-service-config
            - secretRef:
                name: gxdch-issuer-stack
          env:
            - name: EDC_DATASOURCE_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: POSTGRES_USER
            - name: EDC_DATASOURCE_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: POSTGRES_PASSWORD
            - name: EDC_DATASOURCE_MEMBERSHIP_USER
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: POSTGRES_USER
            - name: EDC_DATASOURCE_MEMBERSHIP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: POSTGRES_PASSWORD
          ports:
            - name: web
              containerPort: 10010
            - name: sts
              containerPort: 10011
            - name: issuance
              containerPort: 10012
            - name: issueradmin
              containerPort: 10013
            - name: version
              containerPort: 10014
            - name: identity
              containerPort: 10015
            - name: did
              containerPort: 10016
            - name: debug
              containerPort: 1044
          startupProbe:
            httpGet:
              path: /api/check/startup
              port: web
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/check/readiness
              port: web
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              path: /api/check/liveness
              port: web
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 30
