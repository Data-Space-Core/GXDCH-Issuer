apiVersion: batch/v1
kind: Job
metadata:
  name: issuer-vault-seed
  namespace: gxdch-issuer
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vault-seed
          image: hashicorp/vault:1.18
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until vault status >/dev/null 2>&1; do
                echo "waiting for vault"
                sleep 2
              done
              seed_secret() {
                current="$(vault kv get -field=content "secret/$1" 2>/dev/null || true)"
                if [ "$current" != "$2" ]; then
                  vault kv put "secret/$1" content="$2" >/dev/null
                fi
              }
              seed_secret super-user-apikey "${EDC_IH_API_SUPERUSER_KEY}"
              seed_secret statuslist-signing-key "$(cat /bootstrap/statuslist-signing-key.pem)"
          env:
            - name: VAULT_ADDR
              value: http://issuer-vault:8200
            - name: EDC_IH_API_SUPERUSER_KEY
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: EDC_IH_API_SUPERUSER_KEY
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gxdch-issuer-stack
                  key: EDC_VAULT_HASHICORP_TOKEN
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          secret:
            secretName: issuer-bootstrap
